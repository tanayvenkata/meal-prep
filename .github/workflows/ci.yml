name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # App pool uses the fail-closed mise_app role (password from local seed only).
      DATABASE_URL: postgresql://mise_app:mise_app_local@127.0.0.1:54322/postgres
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1

      - name: Start Supabase local stack
        run: supabase start --exclude realtime,storage-api,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      # Seed only runs on db reset; start applies migrations but not seed passwords.
      - name: Provision local mise_app password
        run: npm run db:provision-app-role
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          MISE_APP_DB_PASSWORD: mise_app_local
          ALLOW_SHORT_MISE_APP_PASSWORD: "1"

      - name: Database integration tests
        run: npm run test:integration

  # Keep this stable check name because the main-branch ruleset requires "test".
  test:
    if: always()
    needs: [quality, database]
    runs-on: ubuntu-latest
    steps:
      - name: Require both test lanes
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: test "$QUALITY_RESULT" = success && test "$DATABASE_RESULT" = success

  deploy-migrations:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1

      - name: Push migrations to remote Supabase
        run: |
          supabase link --project-ref omwvoxemybeukmhnyrhb
          supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
