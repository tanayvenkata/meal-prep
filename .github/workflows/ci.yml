name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Dependent PRs target another codex branch until its PR is merged.
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test:unit

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # App pool uses the fail-closed mise_app role (password from local seed only).
      DATABASE_URL: postgresql://mise_app:mise_app_local@127.0.0.1:54322/postgres
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1
        with:
          version: 2.109.1

      - name: Start Supabase stack and install dependencies
        run: |
          supabase start --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > supabase.log 2>&1 &
          SUPABASE_PID=$!
          trap 'kill -TERM $SUPABASE_PID 2>/dev/null || true' EXIT

          pnpm install --frozen-lockfile

          wait $SUPABASE_PID || { cat supabase.log; exit 1; }
          cat supabase.log

      # Seed only runs on db reset; start applies migrations but not seed passwords.
      - name: Provision local mise_app password
        run: pnpm run db:provision-app-role
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          MISE_APP_DB_PASSWORD: mise_app_local
          ALLOW_SHORT_MISE_APP_PASSWORD: "1"

      - name: Database integration tests
        run: pnpm run test:integration

  # Keep this stable check name because the main-branch ruleset requires "test".
  test:
    if: always()
    needs: [quality, database]
    runs-on: ubuntu-latest
    steps:
      - name: Require both test lanes
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: test "$QUALITY_RESULT" = success && test "$DATABASE_RESULT" = success

  deploy-migrations:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1
        with:
          version: 2.109.1

      - name: Push migrations to remote Supabase
        run: |
          supabase link --project-ref omwvoxemybeukmhnyrhb
          supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
